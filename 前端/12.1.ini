(5)曲线下面积（Area Under Curve, AUC） ： AUC 指的是接收者操作特征曲线（Receiver
Operating Characteristic, ROC） 下的面积。 本案例采用 sklearn.metrics 中的 roc_auc_score 方法
计算。
可以看出准确率（Accuracy） 指标上高斯核 SVM 模型表现最好； 召回率（Recall） 和 f1
score 指标上 Naïve Bayes 模型表现最好； 精确率（Precision） 指标上线性 SVM 模型表现最好；
AUC 指标上逻辑回归模型表现最好； 而 Kappa 系数则是 MLP 模型表现最好。
