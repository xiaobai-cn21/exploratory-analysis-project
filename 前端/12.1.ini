3） 模型优化。 使用 GridSearchCV 方法（ 网格搜索+交叉验证） 对决策树模型进行调参
优化。 GridSearchCV 有几个主要参数：
estimator： 选择使用的分类器， 设为决策树分类器 DecisionTreeClassifier；
param_grid 为分类器需要优化的参数的取值， 值为字典或者列表， 本案例主要设置 splitter
（用来控制决策树生成时“节点” 的选择方式） 、 criterion（用来决定节点 “重要性” 的评
估方式） 、 max_depth（决策树的最大层数， 避免出现过拟合） 三个参数及取值范围；
cv： 交叉验证参数， 值设为 10， 即使用十折交叉验证。图 12-10 模型预测结果
GridSearchCV 在指定的参数范围内， 按步长依次调整参数， 利用调整的参数训练学习器，
从所有的参数中找到在验证集上精度最高的参数。 并将这些参数用于测试集的预测。 代码如
表 12-12 所示。
表 12-12 决策树参数优化代码
决策树参数优化代码
from sklearn.tree import DecisionTreeClassifier
from sklearn.model_selection import GridSearchCV
from sklearn.metrics import confusion_matrix, accuracy_score, classification_report
parameters = { 'splitter': ( 'best', 'random'),
'criterion': ( "gini", "entropy"),
"max_depth": [* range( 3, 20)],
} c
lf = DecisionTreeClassifier(random_state= 25)
GS = GridSearchCV(clf, parameters, scoring= 'f1', cv= 10)
GS.fit(X_train, y_train)
print(GS.best_params_)
print(GS.best_score_)
clf = GS.best_estimator_
test_pred = clf.predict(X_test)
print('测试集： \n', classification_report(y_test, test_pred))
