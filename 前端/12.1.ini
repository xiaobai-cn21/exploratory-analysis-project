使用的评价指标共有五种：
(1)准确率（ Accuracy_score） ： 该指标衡量的是分类任务中正确分类样本所占的比例，
以百分比形式表示。 其计算过程可通过调用 sklearn.metrics 库中的 accuracy_score 函数实现。
(2)召回率（Recall_score） ： 该指标衡量在所有实际为正类别的样本中， 模型正确预测为
正类别的比例。 通过调用 sklearn.metrics 库中的 recall_score 函数进行计算。
(3)精确率（Precision） ： 该指标反映在模型预测为正类别的样本中， 实际为正类别的样
本所占的比例。 通过调用 sklearn.metrics 库中的 precision_score 函数进行计算。
(4)F1 分数： F-Measure 是一种统计量， 亦称为 F-Score， 其定义为精确率（Precision） 与
召回率（Recall） 的加权调和平均值。 特别地， F1 值的计算公式为
