12.1.4 构建模型
构建模型包括划分训练集和测试集、 建立模型并预测、 模型优化， 具体工作如下：
1） 划分训练集和测试集。 代码如表 12-10 所示。
表 12-10 划分数据集代码
划分数据集代码
# 分层抽样
from sklearn.model_selection import train_test_split
from sklearn.preprocessing import StandardScaler
X_train, X_test, y_train, y_test = train_test_split(X_train, y, test_size=0.2, random_state=0,
stratify=y)
print(X_train.shape, X_test.shape, y_train.shape, y_test.shape) #(5625, 20) (1407, 20) (5625, 1)
(1407, 1)
